<body>

<script>
'use strict';
// درس یکم کتاب «هنر الکترونیک» (فصل ۱، بخش‌های ۱.۱ و ۱.۲): ولتاژ، جریان، بار و توان.
// رنگ‌ها: ولتاژ کهربایی (task)، جریان آبی (whole)، بار سبز (good)، توان مرجانی (bad).
const CHAPTER = { number: 1, title: 'ولتاژ، جریان و توان', minutes: 9, language: 'fa' };

/* ---------- شکل‌های این درس ---------- */
// برچسب متنی روی صحنه؛ هر متن یک بند مستقل است، پس فارسی راست‌به‌چپ خوانده می‌شود.
const aoeLabel = (p, s, x, y, t0, { size = 30, fill = COL.dim, anchor = 'middle', weight = 500, dur = .5 } = {}) => {
  const e = T(p, s, { x, y, size, fill, anchor, weight, o: 0 });
  show(e, t0, dur);
  return e;
};
// سیم: خطی که با قلم کشیده می‌شود.
const aoeWire = (p, d, t0, { stroke = COL.chalk, sw = 4, dur = .8 } = {}) => {
  const e = path(p, d, { stroke, 'stroke-width': sw, fill: 'none', 'stroke-linecap': 'round' }, { d: 0, c_stroke: stroke, 'a_stroke-width': sw });
  draw(e, t0, dur);
  return e;
};
// قاب ملایم پشت یک شکل.
const aoeBox = (p, x, y, w, h, t0, { stroke = COL.faint, r = 18, fill = 'rgba(236,232,220,.04)' } = {}) => {
  const g = G(p, { o: 0 });
  mk('rect', { x, y, width: w, height: h, rx: r, fill, stroke, 'stroke-width': 1.6 }, g);
  show(g, t0);
  return g;
};
// مقاومت افقی، وسط آن روی cx،cy.
const aoeRes = (p, cx, cy, t0, { color = COL.chalk, len = 130, h = 32, lead = 40 } = {}) => {
  const half = len / 2, n = 6, step = len / n;
  let d = `M${cx - half - lead} ${cy}H${cx - half}`;
  for (let i = 0; i < n; i++) d += `L${cx - half + step * (i + .5)} ${cy + (i % 2 ? h : -h)}`;
  d += `L${cx + half} ${cy}H${cx + half + lead}`;
  return aoeWire(p, d, t0, { stroke: color });
};
// باتری افقی: صفحهٔ بلند (مثبت) و صفحهٔ کوتاه‌تر و ضخیم (منفی).
const aoeBattery = (p, cx, cy, t0, { color = COL.chalk, gap = 30, big = 46, small = 26, stub = 70 } = {}) => {
  const g = G(p, { o: 0 });
  mk('path', { d: `M${cx - gap} ${cy - big}V${cy + big}M${cx - gap - stub} ${cy}H${cx - gap}`, stroke: color, 'stroke-width': 4, fill: 'none', 'stroke-linecap': 'round' }, g);
  mk('path', { d: `M${cx + gap} ${cy - small}V${cy + small}M${cx + gap} ${cy}H${cx + gap + stub}`, stroke: color, 'stroke-width': 9, fill: 'none', 'stroke-linecap': 'round' }, g);
  show(g, t0);
  return g;
};
// باتری ایستاده (روی سیم عمودی).
const aoeBatteryV = (p, cx, cy, t0, { color = COL.chalk, gap = 30, big = 46, small = 26, stub = 70 } = {}) => {
  const g = G(p, { o: 0 });
  mk('path', { d: `M${cx - big} ${cy - gap}H${cx + big}M${cx} ${cy - gap - stub}V${cy - gap}`, stroke: color, 'stroke-width': 4, fill: 'none', 'stroke-linecap': 'round' }, g);
  mk('path', { d: `M${cx - small} ${cy + gap}H${cx + small}M${cx} ${cy + gap}V${cy + gap + stub}`, stroke: color, 'stroke-width': 9, fill: 'none', 'stroke-linecap': 'round' }, g);
  show(g, t0);
  return g;
};
// فلش ساده.
const aoeArrow = (p, x1, y1, x2, y2, t0, { color = COL.chalk, sw = 4, head = 17, dur = .45 } = {}) => {
  const a = Math.atan2(y2 - y1, x2 - x1), L = Math.hypot(x2 - x1, y2 - y1) - head;
  const bx = x1 + Math.cos(a) * L, by = y1 + Math.sin(a) * L;
  const g = G(p, { o: 0 });
  mk('path', { d: `M${x1} ${y1}L${bx} ${by}`, stroke: color, 'stroke-width': sw, 'stroke-linecap': 'round', fill: 'none' }, g);
  mk('path', { d: `M${x2} ${y2}L${bx + Math.sin(a) * head * .55} ${by - Math.cos(a) * head * .55}L${bx - Math.sin(a) * head * .55} ${by + Math.cos(a) * head * .55}Z`, fill: color }, g);
  show(g, t0, dur);
  return g;
};
// بستهٔ بار: دایره‌ای با برچسب.
const aoePacket = (p, x, y, t0, { color = COL.good, r = 24, text = '1 C', size = 22 } = {}) => {
  const g = G(p, { x, y, o: 0, s: .5 });
  mk('circle', { r, fill: 'rgba(143,214,176,.12)', stroke: color, 'stroke-width': 2.5 }, g);
  T(g, text, { y: size * .34, size, fill: color, anchor: 'middle', weight: 600 });
  tw(g, { o: 1, s: 1 }, t0, .35, back);
  return g;
};
// رابطه در یک قاب: rect + ریاضی.
const aoeFormula = (p, parts, x, y, t0, { size = 52, fill = COL.chalk, pad = 30, stroke = COL.faint, anchor = 'middle' } = {}) => {
  const g = G(p, { o: 0 });
  const m = M(g, [].concat(parts), { x, y, size, fill, anchor });
  const w = m._w + pad * 2, h = size * 1.75;
  const r = mk('rect', { x: anchor === 'middle' ? x - w / 2 : x - pad, y: y - size * .95, width: w, height: h, rx: 16, fill: 'rgba(236,232,220,.05)', stroke, 'stroke-width': 1.6 }, g);
  g.insertBefore(r, g.firstChild);   // قاب پشت رابطه بماند
  show(g, t0, .55);
  return g;
};
// آکولاد افقی برای نشان دادن «روی دو سر».
const aoeBrace = (p, x1, x2, y, label, color, t0) => {
  const g = G(p, { o: 0 });
  mk('path', { d: `M${x1} ${y - 12}V${y}H${x2}V${y - 12}`, stroke: color, 'stroke-width': 3, fill: 'none', 'stroke-linecap': 'round' }, g);
  T(g, label, { x: (x1 + x2) / 2, y: y + 34, size: 28, fill: color, anchor: 'middle', weight: 600 });
  show(g, t0);
  return g;
};
// چراغک: نماد لامپ (دایره با ضربدر) که روشن می‌شود.
const aoeLamp = (p, x, y, t0, { r = 54, color = COL.task } = {}) => {
  const g = G(p, { x, y, o: 0, s: .6 });
  mk('circle', { r, fill: 'rgba(240,180,90,.10)', stroke: color, 'stroke-width': 4 }, g);
  mk('path', { d: `M${-r * .7} ${-r * .7}L${r * .7} ${r * .7}M${r * .7} ${-r * .7}L${-r * .7} ${r * .7}`, stroke: color, 'stroke-width': 3.5 }, g);
  tw(g, { o: 1, s: 1 }, t0, .5, back);
  return g;
};

/* ---------- دادهٔ تمرین‌ها (ثابت‌های داخل BEATS باید پیش از آن تعریف شوند) ---------- */
const AOE_TF = [['t', 'درست', null, 'T'], ['f', 'نادرست', null, 'F']];
const AOE_UNITS = [['v', 'ولتاژ', COL.task, '1'], ['i', 'جریان', COL.whole, '2'], ['q', 'بار', COL.good, '3'], ['p', 'توان', COL.bad, '4']];

/* ---------- گام‌ها: [شناسه، عنوان، run(m, D)، گزینه‌های دیگر] ---------- */
const BEATS = [
  ['intro', 'شالودهٔ الکترونیک', (m, D) => {
    const g = G(scene, { o: 0, y: 24 });
    T(g, 'فصل یک — کتاب هنر الکترونیک', { x: 800, y: 300, size: 28, fill: COL.dim, anchor: 'middle' });
    T(g, 'شالودهٔ الکترونیک', { x: 800, y: 410, size: 92, weight: 600, anchor: 'middle' });
    tw(g, { o: 1, y: 0 }, .2, 1.1, out);
    const sub = aoeLabel(scene, 'بار  ·  جریان  ·  ولتاژ  ·  توان', 800, 540, m('sub'), { size: 42, fill: COL.task, weight: 600 });
    // مدار سادهٔ پایین تصویر
    const c = G(scene, { o: 0 });
    aoeWire(c, 'M420 700H1180', .9, { stroke: COL.faint, sw: 3 });
    aoeRes(c, 800, 700, 1.2, { color: COL.faint, len: 110, h: 26, lead: 30 });
    aoeBattery(c, 420, 700, 1.5, { color: COL.faint, gap: 22, big: 34, small: 20 });
    show(c, .9, .8);
    tw(g, { o: 0, y: -24 }, D - .9, .8);
    hide(sub, D - .9, .8);
    hide(c, D - .9, .8);
  }],
  ['why', 'چرا ولتاژ و جریان؟', (m) => {
    const p = panel(0);
    aoeLabel(p, 'بخش ۱.۲ کتاب: ولتاژ، جریان و مقاومت', 800, 120, .1, { size: 28, fill: COL.dim });
    // مدار: باتری روی ضلع چپ، مقاومت روی ضلع بالا
    const loop = aoeWire(p, 'M260 420H1340V760H260Z', m('a'), { sw: 4.5, dur: 1.4 });
    aoeBatteryV(p, 260, 590, m('a') + .3);
    aoeRes(p, 800, 420, m('a') + .5, { color: COL.chalk, len: 140, h: 34, lead: 46 });
    // ولتاژ روی دو سر مقاومت (بالای مدار)
    aoeBrace(p, 700, 900, 340, 'V', COL.task, m('b'));
    aoeLabel(p, 'ولتاژ روی دو سر مقاومت', 1120, 300, m('b') + .2, { size: 28, fill: COL.task });
    // جریان از میان مسیر (پایین مدار)
    aoeArrow(p, 520, 760, 660, 760, m('c'), { color: COL.whole, sw: 4.5 });
    aoeArrow(p, 1200, 760, 1060, 760, m('c') + .2, { color: COL.whole, sw: 4.5 });
    aoeLabel(p, 'جریان از میان مدار می‌گذرد', 800, 845, m('c') + .4, { size: 28, fill: COL.whole });
    return loop;
  }],
  ['voltage', 'ولتاژ', (m) => {
    const p = panel(0);
    aoeLabel(p, 'ولتاژ', 800, 130, m('v1'), { size: 44, fill: COL.task, weight: 600 });
    // دو تراز پتانسیل
    aoeWire(p, 'M220 420H930', m('v1') + .2, { stroke: COL.dim, sw: 4 });
    aoeWire(p, 'M220 740H930', m('v1') + .4, { stroke: COL.dim, sw: 4 });
    aoeLabel(p, 'پتانسیل بالاتر', 575, 385, m('v1') + .6, { size: 26, fill: COL.dim });
    aoeLabel(p, 'پتانسیل پایین‌تر', 575, 785, m('v1') + .8, { size: 26, fill: COL.dim });
    // بار مثبت و سرازیری
    const ramp = aoeWire(p, 'M330 420L840 740', m('v2'), { stroke: COL.faint, sw: 2.5, dur: .7 });
    const dot = G(p, { x: 330, y: 420, o: 0 });
    mk('circle', { r: 22, fill: 'rgba(143,214,176,.14)', stroke: COL.good, 'stroke-width': 3 }, dot);
    T(dot, '+', { y: 12, size: 34, fill: COL.good, anchor: 'middle', weight: 700 });
    show(dot, m('v2'), .4);
    prog(q => put(dot, { x: 330 + 510 * q, y: 420 + 320 * q }), m('v3'), 1.6, io);
    aoeLabel(p, 'انرژی آزاد می‌شود', 720, 610, m('v3') + 1.0, { size: 26, fill: COL.good });
    // رابطه
    aoeFormula(p, 'V = W / Q', 1230, 300, m('v4'), { size: 58 });
    aoeLabel(p, 'انرژی بر واحد بار', 1230, 400, m('v4') + .35, { size: 28, fill: COL.dim });
    aoeFormula(p, ['1 V = 1 J / C'], 1230, 520, m('v5'), { size: 46, stroke: COL.task });
    aoeLabel(p, 'ولتاژ مثل فشار آب است', 1160, 700, m('v6'), { size: 32, fill: COL.chalk, weight: 600 });
    aoeLabel(p, 'جریان مثل جریان آب است', 1160, 760, m('v6') + .45, { size: 32, fill: COL.chalk, weight: 600 });
    return ramp;
  }],
  ['current', 'جریان', (m) => {
    const p = panel(0);
    aoeLabel(p, 'جریان', 800, 130, m('i1'), { size: 44, fill: COL.whole, weight: 600 });
    aoeWire(p, 'M180 520H1420', m('i2'), { sw: 6, dur: 1.1 });
    // مقطع سنجش بار
    const cut = aoeWire(p, 'M800 462V578', m('i2') + .5, { stroke: COL.faint, sw: 2.5, dur: .4 });
    aoeLabel(p, 'یک نقطه', 800, 440, m('i2') + .7, { size: 24, fill: COL.faint });
    // بسته‌های بار که از مقطع می‌گذرند
    const pk = [0, 1, 2, 3].map(i => aoePacket(p, 600, 520, m('i3') + .15 + i * .35, { text: '1 C' }));
    pk.forEach((g, i) => prog(q => put(g, { x: 600 + 400 * q }), m('i3') + .5 + i * .55, 1.15, lin));
    aoeLabel(p, 'هر ثانیه یک کولن = یک آمپر', 800, 650, m('i3') + 2.1, { size: 30, fill: COL.whole, weight: 600 });
    // رابطه و یکا
    aoeFormula(p, 'I = Q / t', 1260, 250, m('i4'), { size: 50 });
    aoeLabel(p, 'یکا: آمپر، یعنی کولن بر ثانیه', 1260, 350, m('i4') + .3, { size: 28, fill: COL.dim });
    aoeLabel(p, 'در یک آمپر، هر ثانیه حدود ۶ ضربدر ۱۰ به توان ۱۸ الکترون می‌گذرد', 800, 800, m('i5'), { size: 28 });
    return cut;
  }],
  ['ah', 'بار = جریان × زمان', (m) => {
    const p = panel(0);
    aoeFormula(p, 'Q = I · t', 800, 200, m('h1'), { size: 52 });
    // مدار: باتری، حسگر، جریان
    aoeWire(p, 'M380 460H1180V680H380Z', .4, { sw: 4, dur: 1.4 });
    aoeBatteryV(p, 380, 570, .7);
    const dev = aoeBox(p, 640, 625, 280, 105, m('h2'), { stroke: COL.chalk });
    T(dev, 'حسگر', { x: 780, y: 665, size: 34, fill: COL.chalk, anchor: 'middle', weight: 600 });
    T(dev, 'الکترونیکی', { x: 780, y: 707, size: 24, fill: COL.dim, anchor: 'middle' });
    aoeArrow(p, 1000, 460, 1100, 460, m('h2') + .4, { color: COL.whole });
    aoeLabel(p, 'I = 0.2 A', 1050, 420, m('h3'), { size: 30, fill: COL.whole, weight: 600 });
    // ساعت
    const clk = G(p, { x: 1360, y: 560, o: 0, s: .8 });
    mk('circle', { cx: 0, cy: 0, r: 52, fill: 'none', stroke: COL.dim, 'stroke-width': 3 }, clk);
    mk('path', { d: 'M0 0V-32M0 0H22', stroke: COL.dim, 'stroke-width': 3, fill: 'none', 'stroke-linecap': 'round' }, clk);
    tw(clk, { o: 1, s: 1 }, m('h4'), .45, back);
    aoeLabel(p, '۱ ساعت', 1360, 660, m('h4') + .2, { size: 28, fill: COL.dim });
    // حساب
    const calc = G(p, { o: 0 });
    M(calc, ['0.2 × 3600 = 720'], { x: 800, y: 790, size: 38, fill: COL.task, anchor: 'middle' });
    show(calc, m('h4') + .5);
    aoeLabel(p, '۰٫۲ آمپرساعت = ۷۲۰ کولن', 800, 850, m('h5'), { size: 28, fill: COL.dim });
  }],
  ['gen', 'منبع ولتاژ', (m) => {
    const p = panel(0);
    aoeLabel(p, 'این ولتاژها از کجا می‌آیند؟', 800, 130, m('g1'), { size: 34, fill: COL.chalk, weight: 600 });
    const cards = [
      [330, 'باتری', 'شیمیایی ← الکتریکی'],
      [800, 'مولد', 'مکانیکی ← الکتریکی'],
      [1270, 'پیل خورشیدی', 'نور ← الکتریکی'],
    ];
    cards.forEach(([x, name, sub], i) => {
      const t0 = i === 0 ? m('g2') : m('g3') + (i - 1) * .35;
      const c = aoeBox(p, x - 175, 260, 350, 230, t0, { stroke: COL.faint });
      if (i === 0) aoeBatteryV(c, x, 352, t0 + .2, { gap: 18, big: 30, small: 18, stub: 18 });
      else if (i === 1) {
        mk('circle', { cx: x, cy: 330, r: 40, fill: 'none', stroke: COL.chalk, 'stroke-width': 3.5 }, c);
        const a = G(c, { x, y: 330, o: 0, r: 0 });
        mk('path', { d: 'M0 -40A40 40 0 0 1 40 0', stroke: COL.task, 'stroke-width': 4, fill: 'none' }, a);
        mk('path', { d: 'M40 0l-14 -6l6 14z', fill: COL.task }, a);
        show(a, t0 + .3);
        // چرخش پیوستهٔ روتور: چند دور پشت سر هم، با زمان‌بندی ثابت تا بازپخش هم‌سان بماند
        for (let k = 0; k < 3; k++) prog(q => put(a, { r: 360 * (k + q) }), t0 + .3 + k * 1.5, 1.5, lin);
      } else {
        mk('rect', { x: x - 46, y: 300, width: 92, height: 62, rx: 6, fill: 'rgba(240,180,90,.12)', stroke: COL.task, 'stroke-width': 3 }, c);
        mk('path', { d: `M${x - 70} 290l-16 -16M${x} 286v-22M${x + 70} 290l16 -16`, stroke: COL.task, 'stroke-width': 3, fill: 'none', 'stroke-linecap': 'round' }, c);
      }
      T(c, name, { x, y: 430, size: 32, fill: COL.chalk, anchor: 'middle', weight: 600 });
      T(c, sub, { x, y: 470, size: 22, fill: COL.dim, anchor: 'middle' });
    });
    // مدار: سه منبع روی یک ریل
    const bus = G(p, { o: 0 });
    aoeWire(bus, 'M330 490V600M800 490V600M1270 490V600M330 600H1270', m('g4'), { stroke: COL.faint, sw: 3, dur: .9 });
    aoeRes(bus, 800, 600, m('g4') + .3, { len: 120, h: 28, lead: 36 });
    aoeArrow(bus, 520, 600, 620, 600, m('g4') + .5, { color: COL.whole, sw: 4 });
    aoeArrow(bus, 1080, 600, 980, 600, m('g4') + .65, { color: COL.whole, sw: 4 });
    aoeLabel(bus, 'جریان، وقتی ولتاژ به دو سر مدار می‌رسد', 800, 700, m('g4') + .8, { size: 28, fill: COL.whole });
    show(bus, m('g4'));
  }],
  ['q1', 'بررسی: بار و جریان', () => { panel(0); }, { ask: done => quiz(BAND, [{
    id: 'c-charge-current',
    prompt: ['در ۲ ثانیه، ۰٫۶ کولن بار از یک نقطه می‌گذرد. جریان چند آمپر است؟ اگر جریان ۰٫۵ آمپر باشد، در ۴ ثانیه چند کولن بار می‌گذرد؟'],
    build: blanks([
      { parts: ['I = ', { box: '0.3' }, ' A'], why: 'جریان = بار ÷ زمان = ۰٫۶ ÷ ۲ = ۰٫۳ آمپر.', hint: 'بار را بر زمان تقسیم کنید.' },
      { parts: ['Q = ', { box: '2' }, ' C'], why: 'بار = جریان × زمان = ۰٫۵ × ۴ = ۲ کولن.', hint: 'جریان را در زمان ضرب کنید.' },
    ]),
  }], done) }],
  ['rule', 'زبان دقیق', (m) => {
    const p = panel(0);
    aoeLabel(p, 'یک نکتهٔ زبانی', 800, 120, m('y1'), { size: 32, fill: COL.chalk, weight: 600 });
    // راست: جریان از میان
    const right = aoeBox(p, 840, 200, 660, 380, .2, { stroke: COL.faint });
    aoeRes(p, 1170, 390, .5, { color: COL.chalk, len: 150, h: 34, lead: 50 });
    aoeArrow(p, 1000, 460, 1340, 460, m('y2'), { color: COL.whole, sw: 4.5 });
    aoeLabel(p, 'جریان از میان مقاومت می‌گذرد', 1170, 520, m('y2') + .3, { size: 30, fill: COL.whole, weight: 600 });
    // چپ: ولتاژ روی دو سر
    const left = aoeBox(p, 100, 200, 660, 380, .2, { stroke: COL.faint });
    aoeRes(p, 430, 390, .5, { color: COL.chalk, len: 150, h: 34, lead: 50 });
    aoeArrow(p, 330, 300, 330, 350, m('y3'), { color: COL.task, sw: 3.5, head: 14 });
    aoeArrow(p, 530, 300, 530, 350, m('y3') + .15, { color: COL.task, sw: 3.5, head: 14 });
    aoeLabel(p, 'ولتاژ روی دو سر مقاومت است', 430, 260, m('y3') + .3, { size: 30, fill: COL.task, weight: 600 });
    // جملهٔ نادرست، خط‌خورده
    const wrong = aoeLabel(p, 'ولتاژ از مقاومت می‌گذرد', 430, 520, m('y4'), { size: 30, fill: COL.bad });
    const strike = aoeWire(p, 'M300 508L560 508', m('y4') + .5, { stroke: COL.bad, sw: 4, dur: .35 });
